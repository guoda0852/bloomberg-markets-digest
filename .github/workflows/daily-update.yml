name: 每日更新市场数据

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取行情与新闻
        run: python scripts/fetch.py
      - name: 提交更新
        run: |
          git config user.name "markets-bot"
          git config user.email "markets-bot@users.noreply.github.com"
          git add data/market.json data/news.json
          git diff --cached --quiet || git commit -m "每日数据更新 $(date -u +%F)"
          git push
