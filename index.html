<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彭博市场速览 · Bloomberg Markets Digest</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --up: #3fb950; --down: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         padding: 24px 16px 48px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  header h1 span { color: var(--accent); font-size: 15px; font-weight: 400; margin-left: 10px; }
  header p { color: var(--muted); font-size: 13px; margin-top: 8px; }
  h2 { font-size: 18px; margin: 32px 0 14px; padding-left: 10px;
       border-left: 3px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px; }
  .card .name { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .card .price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .chg { font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .group-label { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .news { display: flex; flex-direction: column; gap: 0; }
  .news a { display: block; padding: 13px 4px; border-bottom: 1px solid var(--border);
            color: var(--text); text-decoration: none; }
  .news a:hover .t { color: var(--accent); }
  .news .t { font-size: 15px; line-height: 1.5; }
  .news .orig { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .news .meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  footer a { color: var(--accent); }
  .loading { color: var(--muted); padding: 20px 0; }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { background: var(--card); border: 1px solid var(--border); color: var(--text);
                 border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
                padding: 16px; margin-bottom: 12px; }
  .chart-card .cname { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  #klines-main { width: 100%; height: 380px; }
  #klines-rsi { width: 100%; height: 120px; margin-top: 8px; }
  #klines-macd { width: 100%; height: 140px; margin-top: 8px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
</style>
  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>彭博市场速览<span>Bloomberg Markets Digest</span></h1>
    <p id="updated">数据加载中…</p>
  </header>

  <h2>市场行情</h2>
  <div class="grid" id="market"><div class="loading">加载中…</div></div>


  <h2>A股指数 K 线</h2>
  <div class="tabs" id="kline-tabs"><div class="loading">加载中…</div></div>
  <div class="chart-card" id="kline-card" style="display:none">
    <div class="cname" id="kline-title"></div>
    <div id="klines-main"></div>
    <div class="legend">
      <span><i style="background:#2962FF"></i>MA5</span>
      <span><i style="background:#FF6D00"></i>MA10</span>
      <span><i style="background:#9C27B0"></i>MA20</span>
    </div>
    <div id="klines-rsi"></div>
    <div class="legend"><span><i style="background:#7E57C2"></i>RSI(14)</span>
      <span><i style="background:#787B86"></i>超买 70 / 超卖 30</span></div>
    <div id="klines-macd"></div>
    <div class="legend"><span><i style="background:#2962FF"></i>DIF</span>
      <span><i style="background:#FF6D00"></i>DEA</span>
      <span><i style="background:#26A69A"></i>MACD 柱</span></div>
  </div>

  <h2>彭博重点新闻</h2>
  <div class="news" id="news"><div class="loading">加载中…</div></div>

  <footer>
    行情数据来自公开市场数据源（Yahoo Finance）；A股指数 K 线来自同花顺金融数据服务。每日北京时间 7:00 自动更新，仅供参考，不构成投资建议。<br>
    新闻标题聚合自彭博社公开报道，点击跳转阅读原文（部分内容需彭博订阅）。
  </footer>
</div>

<script>
const fmt = n => n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

async function load() {
  try {
    const [m, n] = await Promise.all([
      fetch('data/market.json').then(r => r.json()),
      fetch('data/news.json').then(r => r.json())
    ]);
    document.getElementById('updated').textContent =
      '数据更新时间：' + (m.updated_at || n.updated_at || '未知').replace('T', ' ').slice(0, 19);

    const mg = document.getElementById('market');
    mg.textContent = '';
    let lastGroup = '';
    m.items.forEach(it => {
      if (it.group !== lastGroup) {
        lastGroup = it.group;
        const gl = document.createElement('div');
        gl.className = 'group-label';
        gl.textContent = it.group;
        mg.appendChild(gl);
      }
      const cls = it.change_pct >= 0 ? 'up' : 'down';
      const sign = it.change_pct >= 0 ? '+' : '';
      const card = document.createElement('div');
      card.className = 'card';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = it.name;
      const price = document.createElement('div');
      price.className = 'price';
      price.textContent = fmt(it.price);
      const chg = document.createElement('div');
      chg.className = 'chg ' + cls;
      chg.textContent = sign + it.change_pct.toFixed(2) + '%';
      card.append(name, price, chg);
      mg.appendChild(card);
    });

    const nw = document.getElementById('news');
    nw.textContent = '';
    n.items.forEach(it => {
      const d = it.pub_date ? new Date(it.pub_date).toLocaleString('zh-CN', {hour12: false}) : '';
      const a = document.createElement('a');
      a.href = it.link;
      a.target = '_blank';
      a.rel = 'noopener';
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = it.title_zh || it.title;
      a.appendChild(t);
      if (it.title_zh && it.title_zh !== it.title) {
        const orig = document.createElement('div');
        orig.className = 'orig';
        orig.textContent = it.title;
        a.appendChild(orig);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = it.source + ' · ' + d;
      a.appendChild(meta);
      nw.appendChild(a);
    });
  } catch (e) {
    document.getElementById('updated').textContent = '数据加载失败，请稍后刷新重试。';
  }
}
load();

// ---------- A股 K 线 ----------
function sma(vals, n) {
  const out = new Array(vals.length).fill(null);
  let sum = 0;
  for (let i = 0; i < vals.length; i++) {
    sum += vals[i];
    if (i >= n) sum -= vals[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}
function ema(vals, n) {
  const out = new Array(vals.length).fill(null);
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < vals.length; i++) {
    prev = prev === null ? vals[i] : vals[i] * k + prev * (1 - k);
    if (i >= n - 1) out[i] = prev;
  }
  return out;
}
function rsi(closes, n = 14) {
  const out = new Array(closes.length).fill(null);
  let gain = 0, loss = 0;
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    if (i <= n) { gain += g; loss += l;
      if (i === n) {
        gain /= n; loss /= n;
        out[i] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
      }
    } else {
      gain = (gain * (n - 1) + g) / n; loss = (loss * (n - 1) + l) / n;
      out[i] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
    }
  }
  return out;
}
function macd(closes, fast = 12, slow = 26, sig = 9) {
  const ef = ema(closes, fast), es = ema(closes, slow);
  const dif = closes.map((_, i) => (ef[i] !== null && es[i] !== null) ? ef[i] - es[i] : null);
  const difV = dif.map(v => v === null ? 0 : v);
  const deaRaw = ema(difV, sig);
  const dea = dif.map((v, i) => v === null ? null : deaRaw[i]);
  const hist = dif.map((v, i) => (v === null || dea[i] === null) ? null : (v - dea[i]) * 2);
  return { dif, dea, hist };
}
function lineData(times, vals) {
  const d = [];
  for (let i = 0; i < vals.length; i++) if (vals[i] !== null) d.push({ time: times[i], value: +vals[i].toFixed(2) });
  return d;
}
let kCharts = [];
async function loadKlines() {
  const tabsEl = document.getElementById('kline-tabs');
  try {
    const k = await fetch('data/klines.json').then(r => { if (!r.ok) throw 0; return r.json(); });
    const syms = Object.keys(k.symbols || {});
    if (!syms.length) throw 0;
    document.getElementById('kline-card').style.display = '';
    tabsEl.textContent = '';
    syms.forEach((code, idx) => {
      const b = document.createElement('button');
      b.textContent = k.symbols[code].name;
      b.onclick = () => { [...tabsEl.children].forEach(x => x.classList.remove('active')); b.classList.add('active'); drawKline(k.symbols[code]); };
      if (idx === 0) b.classList.add('active');
      tabsEl.appendChild(b);
    });
    drawKline(k.symbols[syms[0]]);
  } catch (e) {
    tabsEl.innerHTML = '<div class="loading">K 线数据暂未生成</div>';
  }
}
function drawKline(sym) {
  kCharts.forEach(c => { try { c.remove(); } catch (e) {} });
  kCharts = [];
  const bars = sym.klines;
  const times = bars.map(b => b.date);
  const closes = bars.map(b => b.close);
  document.getElementById('kline-title').textContent =
    sym.name + '（' + sym.thscode + '）· 日K · 数据：同花顺';
  const opts = {
    layout: { background: { color: 'transparent' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    timeScale: { timeVisible: false },
  };
  const mc = LightweightCharts.createChart(document.getElementById('klines-main'), { ...opts, height: 380 });
  const cs = mc.addSeries(LightweightCharts.CandlestickSeries, { upColor: '#f23645', downColor: '#089981', wickUpColor: '#f23645', wickDownColor: '#089981' });
  cs.setData(bars.map(b => ({ time: b.date, open: b.open, high: b.high, low: b.low, close: b.close })));
  [['#2962FF', 5], ['#FF6D00', 10], ['#9C27B0', 20]].forEach(([c, n]) => {
    const ls = mc.addSeries(LightweightCharts.LineSeries, { color: c, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    ls.setData(lineData(times, sma(closes, n)));
  });
  const rc = LightweightCharts.createChart(document.getElementById('klines-rsi'), { ...opts, height: 120 });
  const rs = rc.addSeries(LightweightCharts.LineSeries, { color: '#7E57C2', lineWidth: 1, priceLineVisible: false });
  rs.setData(lineData(times, rsi(closes)));
  [70, 30].forEach(v => {
    const pl = rc.addSeries(LightweightCharts.LineSeries, { color: '#787B86', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
    pl.setData(times.map(t => ({ time: t, value: v })));
  });
  const dc = LightweightCharts.createChart(document.getElementById('klines-macd'), { ...opts, height: 140 });
  const { dif, dea, hist } = macd(closes);
  const hs = dc.addSeries(LightweightCharts.HistogramSeries, { priceLineVisible: false });
  hs.setData(times.map((t, i) => hist[i] === null ? null : { time: t, value: +hist[i].toFixed(2), color: hist[i] >= 0 ? '#26A69A' : '#EF5350' }).filter(Boolean));
  const df = dc.addSeries(LightweightCharts.LineSeries, { color: '#2962FF', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  df.setData(lineData(times, dif));
  const de = dc.addSeries(LightweightCharts.LineSeries, { color: '#FF6D00', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  de.setData(lineData(times, dea));
  kCharts = [mc, rc, dc];
}
loadKlines();
</script>
</body>
</html>
